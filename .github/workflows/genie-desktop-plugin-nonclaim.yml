name: Genie Desktop plugin host compatibility NONCLAIM

on:
  push:
    branches:
      - nonclaim/genie-desktop-host-compat-unknown-20261011
    paths:
      - .gitattributes
      - desktop_plugin/**
      - '!desktop_plugin/*.md'
      - '!desktop_plugin/TEST_RESULTS.txt'
      - '!desktop_plugin/VERIFICATION.json'
      - shared_interfaces/**
      - active_runner/**
      - run_queue/**
      - host_adapter/**
      - worker_bridge/**
      - host_return/trial/**
      - plugin_mcp_server/requirements.lock.txt
      - .github/workflows/genie-desktop-plugin-nonclaim.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package-conformance:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up exact Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Create isolated exact build environment
        run: |
          python -m venv desktop_plugin/.venv
          $py = 'desktop_plugin/.venv/Scripts/python.exe'
          & $py -m pip install --disable-pip-version-check -r plugin_mcp_server/requirements.lock.txt -r desktop_plugin/windows-build.lock.txt
          & $py -m pip check
          & $py -m pip freeze

      - name: Verify exact Windows runtime and build closures
        run: |
          $py = 'desktop_plugin/.venv/Scripts/python.exe'
          @'
          import importlib.metadata as md
          from shared_interfaces.mcp_server import required_transport_distributions
          expected = required_transport_distributions()
          expected.update({
              'altgraph': '0.17.5',
              'packaging': '26.3',
              'pefile': '2024.8.26',
              'pyinstaller': '6.22.3',
              'pyinstaller-hooks-contrib': '2026.8',
              'pywin32-ctypes': '0.2.3',
              'setuptools': '84.0.0',
          })
          mismatches = {
              name: (version, md.version(name))
              for name, version in expected.items()
              if md.version(name) != version
          }
          assert not mismatches, mismatches
          print('WINDOWS_PACKAGE_VERSION_CLOSURE_PASS', len(expected))
          '@ | & $py -

      - name: Preflight exact Genie source and real read-only calls on Windows
        run: |
          $py = 'desktop_plugin/.venv/Scripts/python.exe'
          @'
          import hashlib
          from pathlib import Path
          from shared_interfaces import cli, mcp_server, status_tool

          root = Path('host_return/trial')
          sqlite_files = sorted(root.rglob('*.sqlite'))
          before = {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in sqlite_files}

          runs = cli._read_registry(root / 'REGISTRY.json')
          host = status_tool.GenieStatusTools(runs)
          status = host.call('get_run_status', {'run_name': 'actual'})
          assert status.get('status') == 'PASS', status
          confirmed = [
              item for item in status.get('tasks', [])
              if isinstance(item, dict)
              and isinstance(item.get('fresh_sink'), dict)
              and item['fresh_sink'].get('status') == 'CONFIRMED'
          ]
          assert confirmed, status
          task_id = confirmed[0]['task_id']
          result = host.call('get_task_result', {'run_name': 'actual', 'task_id': task_id})
          assert result.get('status') == 'CONFIRMED', result
          assert result.get('content_role') == 'UNTRUSTED_ACCEPTED_TASK_DATA', result

          server = mcp_server.build_server(runs)
          assert server is not None
          after = {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in sqlite_files}
          assert after == before, (before, after)
          print('WINDOWS_SOURCE_AND_READONLY_CALL_CHAIN_PASS', len(sqlite_files), task_id)
          '@ | & $py -

      - name: Prepare deterministic seed state and UNKNOWN fixture
        run: |
          $py = 'desktop_plugin/.venv/Scripts/python.exe'
          @'
          import hashlib, json, shutil, sqlite3
          from pathlib import Path

          source = Path('host_return/trial')
          target = Path('desktop_plugin/build_seed')
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(source, target)

          registry_path = target / 'REGISTRY.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          assert set(registry) == {'actual'}, registry
          actual_run_id = registry['actual']['run_id']

          synthetic_run_id = 'genie-plugin-synthetic-unknown-20261011'
          synthetic = target / 'synthetic_unknown'
          synthetic.mkdir()
          synthetic_queue = synthetic / 'queue.sqlite'
          shutil.copy2(source / 'queue.sqlite', synthetic_queue)

          with sqlite3.connect(synthetic_queue) as db:
              row = db.execute('SELECT policy FROM run WHERE id=1').fetchone()
              assert row is not None
              policy = json.loads(row[0])
              assert policy['run_id'] == actual_run_id
              policy['run_id'] = synthetic_run_id
              canonical = json.dumps(policy, sort_keys=True, separators=(',', ':'))
              db.execute('UPDATE run SET policy=? WHERE id=1', (canonical,))
              known = db.execute('SELECT task_id FROM entries ORDER BY seq LIMIT 1').fetchone()
              assert known is not None and isinstance(known[0], str) and known[0]
              assert db.execute('PRAGMA integrity_check').fetchone() == ('ok',)

          missing_root = synthetic / 'missing-work'
          assert not missing_root.exists()
          registry['synthetic-unknown'] = {
              'queue': 'synthetic_unknown/queue.sqlite',
              'run_id': synthetic_run_id,
              'owned_root': 'synthetic_unknown/missing-work',
          }
          registry_path.write_text(
              json.dumps(registry, sort_keys=True, indent=2) + '\n',
              encoding='utf-8')

          records = []
          for path in sorted(target.rglob('*')):
              if path.is_file() and path.name != 'SEED_MANIFEST.json':
                  raw = path.read_bytes()
                  records.append({
                      'path': path.relative_to(target).as_posix(),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'size': len(raw),
                  })
          canonical = json.dumps(records, sort_keys=True, separators=(',', ':')).encode()
          seed_id = 'host-return-plus-unknown-' + hashlib.sha256(canonical).hexdigest()[:20]
          manifest = {'seed_id': seed_id, 'files': records}
          (target / 'SEED_MANIFEST.json').write_text(
              json.dumps(manifest, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8')
          print('SYNTHETIC_UNKNOWN_FIXTURE_PASS', synthetic_run_id, known[0])
          print('SEED_MANIFEST_PASS', seed_id, len(records))
          '@ | & $py -

      - name: Build self-contained Windows stdio executable
        run: |
          desktop_plugin/.venv/Scripts/pyinstaller.exe --clean --noconfirm --distpath desktop_plugin/build_dist --workpath desktop_plugin/build_work desktop_plugin/genie_mcp.spec

      - name: Assemble portable plus Codex-compatible plugin folder
        run: |
          $root = 'desktop_plugin/staging/genie-readonly'
          New-Item -ItemType Directory -Force -Path "$root/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/.codex-plugin" | Out-Null
          Copy-Item desktop_plugin/package/plugin.json "$root/plugin.json"
          Copy-Item desktop_plugin/package/mcp.json "$root/mcp.json"
          Copy-Item desktop_plugin/package/.codex-plugin/plugin.json "$root/.codex-plugin/plugin.json"
          Copy-Item desktop_plugin/package/.mcp.json "$root/.mcp.json"
          Copy-Item desktop_plugin/build_dist/genie-mcp.exe "$root/bin/genie-mcp.exe"
          Get-ChildItem -Force -Recurse $root | Select-Object FullName,Length

      - name: Exercise frozen plugin lifecycle and stdio tools
        run: |
          $env:GENIE_PLUGIN_ROOT = (Resolve-Path 'desktop_plugin/staging/genie-readonly').Path
          desktop_plugin/.venv/Scripts/python.exe -B desktop_plugin/test_frozen.py

      - name: Record package identities
        run: |
          $exe = 'desktop_plugin/staging/genie-readonly/bin/genie-mcp.exe'
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $exeSize = (Get-Item $exe).Length
          Compress-Archive -Path 'desktop_plugin/staging/genie-readonly' -DestinationPath 'desktop_plugin/genie-readonly-windows.zip' -Force
          $zipHash = (Get-FileHash 'desktop_plugin/genie-readonly-windows.zip' -Algorithm SHA256).Hash.ToLower()
          $zipSize = (Get-Item 'desktop_plugin/genie-readonly-windows.zip').Length
          Write-Output "GENIE_DESKTOP_EXE_SHA256=$exeHash"
          Write-Output "GENIE_DESKTOP_EXE_BYTES=$exeSize"
          Write-Output "GENIE_DESKTOP_ZIP_SHA256=$zipHash"
          Write-Output "GENIE_DESKTOP_ZIP_BYTES=$zipSize"

      - name: Publish verified install package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: desktop_plugin/genie-readonly-windows.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
