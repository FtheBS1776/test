name: Genie Desktop plugin package NONCLAIM

on:
  push:
    branches:
      - nonclaim/genie-desktop-plugin-package-20261011
    paths:
      - .gitattributes
      - desktop_plugin/**
      - '!desktop_plugin/*.md'
      - '!desktop_plugin/TEST_RESULTS.txt'
      - '!desktop_plugin/VERIFICATION.json'
      - shared_interfaces/**
      - active_runner/**
      - run_queue/**
      - host_adapter/**
      - worker_bridge/**
      - host_return/trial/**
      - plugin_mcp_server/requirements.lock.txt
      - .github/workflows/genie-desktop-plugin-nonclaim.yml
      - .github/actions/genie-windows-package/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package-conformance:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up exact Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Build and check exact Windows package
        uses: ./.github/actions/genie-windows-package

      - name: Publish verified install package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: desktop_plugin/genie-readonly-windows.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
