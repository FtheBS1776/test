name: BRAINS10 strict WAL terminal fixture validation (NONCLAIM)

on:
  push:
    branches:
      - nonclaim/etcd-strict-wal-20261006

permissions:
  contents: read

jobs:
  strict-wal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact fixture subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Checkout pinned official observer dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: etcd-io/etcd
          ref: a0614505aff9b8ff469e9c59c2d979a5936d13f4
          path: observer-upstream
          persist-credentials: false
      - name: Build observer and validate retained input fixtures
        env:
          EXPECTED_SOURCE_MANIFEST: d18f22a3c81d9ea30aa134d9d3b544ba1173eefddb2dfa92d5bd37343521ba92
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          python3 -B strict_wal/run_capture.py \
            --output "${RUNNER_TEMP}/strict-wal-evidence" \
            --upstream "${GITHUB_WORKSPACE}/observer-upstream" \
            --expected-source-manifest "${EXPECTED_SOURCE_MANIFEST}"
      - name: Preserve all returned evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-wal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strict-wal-evidence/**
          if-no-files-found: error
          overwrite: false
          retention-days: 1
