name: R2 Real Provider Conformance Capture

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/r2-real-provider-capture.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create harmless nonclaim probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' \
            'EXP010-R2 REAL-PROVIDER CONFORMANCE PROBE' \
            'NONCLAIM=TRUE' \
            'NO_BEACON=TRUE' \
            'NO_SEED=TRUE' \
            'NO_SCIENTIFIC_EXECUTION=TRUE' > evidence/provider_probe.txt
          sha256sum evidence/provider_probe.txt > evidence/provider_probe.sha256
          gh --version > evidence/gh_version.txt
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "repository_id=${GITHUB_REPOSITORY_ID}" \
            "workflow_ref=${GITHUB_WORKFLOW_REF}" \
            "workflow_sha=${GITHUB_WORKFLOW_SHA}" \
            "run_id=${GITHUB_RUN_ID}" \
            "run_attempt=${GITHUB_RUN_ATTEMPT}" \
            "runner_environment=github-hosted" \
            "sha=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}" > evidence/run_context.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Capture fresh live OIDC execution identity (nonclaim)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, secrets, urllib.parse, urllib.request, time, pathlib
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; bearer=os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          u=urllib.parse.urlsplit(url); host=(u.hostname or '').lower()
          if u.scheme!='https' or not (host=='actions.githubusercontent.com' or host.endswith('.actions.githubusercontent.com')): raise SystemExit('bad OIDC endpoint')
          nonce=secrets.token_urlsafe(32); aud='urn:exp010:r2:execution:'+nonce
          q=urllib.parse.parse_qsl(u.query,keep_blank_values=True); q.append(('audience',aud))
          target=urllib.parse.urlunsplit((u.scheme,u.netloc,u.path,urllib.parse.urlencode(q),u.fragment))
          req=urllib.request.Request(target,headers={'Authorization':'Bearer '+bearer,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=15) as r: token=json.loads(r.read())['value']
          h,p,_=token.split('.')
          dec=lambda s:json.loads(base64.urlsafe_b64decode(s+'='*((4-len(s)%4)%4)))
          header,claims=dec(h),dec(p); now=int(time.time())
          required={'iss':'https://token.actions.githubusercontent.com','aud':aud,'repository':os.environ['GITHUB_REPOSITORY'],'repository_id':os.environ['GITHUB_REPOSITORY_ID'],'workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],'workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'runner_environment':'github-hosted'}
          for k,v in required.items():
              if str(claims.get(k))!=str(v): raise SystemExit('OIDC mismatch '+k)
          if header.get('alg')!='RS256' or header.get('typ')!='JWT' or claims['exp']<now: raise SystemExit('OIDC header/time failure')
          safe={k:claims.get(k) for k in ['iss','repository','repository_id','repository_owner_id','workflow_ref','workflow_sha','run_id','run_attempt','runner_environment','event_name','ref','iat','nbf','exp']}
          safe['audience_nonce_sha256']=hashlib.sha256(aud.encode()).hexdigest(); safe['jwt_header']={k:header.get(k) for k in ['alg','typ','kid']}; safe['token_preserved']=False
          pathlib.Path('evidence/live_oidc_sanitized_claims.json').write_text(json.dumps(safe,sort_keys=True,indent=2)+'\\n')
          PY

      - name: Generate GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: evidence/provider_probe.txt

      - name: Capture real gh verifier output and bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify evidence/provider_probe.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/r2-real-provider-capture.yml@${GITHUB_REF}" \
            --signer-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners \
            --format json > evidence/gh_attestation_verify_raw.json 2> evidence/gh_attestation_verify_stderr.txt

          gh attestation download evidence/provider_probe.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --limit 100 > evidence/gh_attestation_download_stdout.txt 2> evidence/gh_attestation_download_stderr.txt
          find . -maxdepth 1 -type f -name "sha256*.jsonl" -exec cp {} evidence/gh_attestation_bundle.jsonl \;
          gh attestation trusted-root > evidence/trusted_root.jsonl

          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("evidence/gh_attestation_verify_raw.json")
          obj=json.loads(p.read_text())
          summary={
              "top_level_type": type(obj).__name__,
              "entries": len(obj) if isinstance(obj,list) else None,
              "entry_keys": [sorted(x.keys()) for x in obj] if isinstance(obj,list) else None,
          }
          pathlib.Path("evidence/schema_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True)+"\n"
          )
          PY

          DIGEST="$(awk '{print $1}' evidence/provider_probe.sha256)"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/attestations/sha256:${DIGEST}?per_page=100" > evidence/rest_attestation_discovery_pages.json

          mkdir -p evidence/broad_verified
          python3 - <<'PY'
          import json, pathlib
          pages=json.loads(pathlib.Path('evidence/rest_attestation_discovery_pages.json').read_text())
          items=[x for page in pages for x in page.get('attestations',[])]
          for i,item in enumerate(items):
              # The REST response already carries the Sigstore bundle as structured JSON.
              # Preserve exactly that authenticated-discovery representation for gh verification.
              body=(json.dumps(item['bundle'], separators=(',', ':'), ensure_ascii=False)+'\n').encode()
              if len(body)>8*1024*1024: raise SystemExit('bundle too large')
              pathlib.Path(f'evidence/broad_verified/bundle_{i}.json').write_bytes(body)
          pathlib.Path('evidence/broad_verified/count.txt').write_text(str(len(items))+'\n')
          PY
          : > evidence/broad_verify_commands.txt
          for bundle in evidence/broad_verified/bundle_*.json; do
            idx="$(basename "$bundle" .json | cut -d_ -f2)"
            printf '%q ' gh attestation verify evidence/provider_probe.txt -R "${GITHUB_REPOSITORY}" --bundle "$bundle" --custom-trusted-root evidence/trusted_root.jsonl --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners --format json >> evidence/broad_verify_commands.txt
            printf '\n' >> evidence/broad_verify_commands.txt
            gh attestation verify evidence/provider_probe.txt -R "${GITHUB_REPOSITORY}" --bundle "$bundle" --custom-trusted-root evidence/trusted_root.jsonl --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners --format json > "evidence/broad_verified/result_${idx}.json"
          done
          (cd evidence && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload byte-preserving conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-real-provider-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

# public-provider capture retry
