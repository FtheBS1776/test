name: R2 Real Provider Conformance Capture

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/r2-real-provider-capture.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create harmless nonclaim probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' \
            'EXP010-R2 REAL-PROVIDER CONFORMANCE PROBE' \
            'NONCLAIM=TRUE' \
            'NO_BEACON=TRUE' \
            'NO_SEED=TRUE' \
            'NO_SCIENTIFIC_EXECUTION=TRUE' > evidence/provider_probe.txt
          sha256sum evidence/provider_probe.txt > evidence/provider_probe.sha256
          gh --version > evidence/gh_version.txt
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "repository_id=${GITHUB_REPOSITORY_ID}" \
            "workflow_ref=${GITHUB_WORKFLOW_REF}" \
            "workflow_sha=${GITHUB_WORKFLOW_SHA}" \
            "run_id=${GITHUB_RUN_ID}" \
            "run_attempt=${GITHUB_RUN_ATTEMPT}" \
            "runner_environment=github-hosted" \
            "sha=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}" > evidence/run_context.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: evidence/provider_probe.txt

      - name: Capture real gh verifier output and bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify evidence/provider_probe.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/r2-real-provider-capture.yml@${GITHUB_REF}" \
            --signer-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners \
            --format json > evidence/gh_attestation_verify_raw.json 2> evidence/gh_attestation_verify_stderr.txt

          gh attestation download evidence/provider_probe.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --limit 100 > evidence/gh_attestation_download_stdout.txt 2> evidence/gh_attestation_download_stderr.txt
          find . -maxdepth 1 -type f -name "sha256*.jsonl" -exec cp {} evidence/gh_attestation_bundle.jsonl \;
          gh attestation trusted-root > evidence/trusted_root.jsonl

          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("evidence/gh_attestation_verify_raw.json")
          obj=json.loads(p.read_text())
          summary={
              "top_level_type": type(obj).__name__,
              "entries": len(obj) if isinstance(obj,list) else None,
              "entry_keys": [sorted(x.keys()) for x in obj] if isinstance(obj,list) else None,
          }
          pathlib.Path("evidence/schema_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True)+"\n"
          )
          PY

          DIGEST="$(awk '{print $1}' evidence/provider_probe.sha256)"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/attestations/sha256:${DIGEST}?per_page=100" > evidence/rest_attestation_discovery_pages.json

          mkdir -p evidence/broad_verified
          python3 - <<'PY'
          import json, pathlib, urllib.request
          pages=json.loads(pathlib.Path('evidence/rest_attestation_discovery_pages.json').read_text())
          items=[x for page in pages for x in page.get('attestations',[])]
          for i,item in enumerate(items):
              with urllib.request.urlopen(item['bundle_url'], timeout=30) as r:
                  body=r.read(8*1024*1024+1)
              if len(body)>8*1024*1024: raise SystemExit('bundle too large')
              pathlib.Path(f'evidence/broad_verified/bundle_{i}.json').write_bytes(body)
          pathlib.Path('evidence/broad_verified/count.txt').write_text(str(len(items))+'\n')
          PY
          : > evidence/broad_verify_commands.txt
          for bundle in evidence/broad_verified/bundle_*.json; do
            idx="$(basename "$bundle" .json | cut -d_ -f2)"
            printf '%q ' gh attestation verify evidence/provider_probe.txt -R "${GITHUB_REPOSITORY}" --bundle "$bundle" --custom-trusted-root evidence/trusted_root.jsonl --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners --format json >> evidence/broad_verify_commands.txt
            printf '\n' >> evidence/broad_verify_commands.txt
            gh attestation verify evidence/provider_probe.txt -R "${GITHUB_REPOSITORY}" --bundle "$bundle" --custom-trusted-root evidence/trusted_root.jsonl --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners --format json > "evidence/broad_verified/result_${idx}.json"
          done
\n          (cd evidence && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload byte-preserving conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-real-provider-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

# public-provider capture retry
