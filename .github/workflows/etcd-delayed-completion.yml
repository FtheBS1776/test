name: BRAINS10 delayed completion evidence (NONCLAIM)

on:
  push:
    branches:
      - nonclaim/etcd-delayed-completion-20261006

permissions:
  contents: read

jobs:
  delayed-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Capture bounded evidence
        env:
          EXPECTED_SOURCE_MANIFEST: 9a127d5fd854a6179321d14fed62b15b080482eb951f36d9c093fcae13b14cb7
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          python3 -B delayed_completion/run_capture.py \
            --output "${RUNNER_TEMP}/delayed-completion-evidence" \
            --expected-source-manifest "${EXPECTED_SOURCE_MANIFEST}"
      - name: Preserve all returned evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delayed-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delayed-completion-evidence/**
          if-no-files-found: error
          overwrite: false
          retention-days: 1
